<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Candidate Verification</title>

  <style>
    :root{
      --bg:#0b1020;
      --text:#e8ecff;
      --muted:#aab3d6;
      --accent:#7aa2ff;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #18214a 0%, var(--bg) 55%), var(--bg);
      color: var(--text);
    }

    /* watermark */
    body::before{
      content:"";
      position: fixed;
      inset: 0;
      background: url("./assets/watermark.png") center/420px no-repeat;
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }

    .wrap{
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 60px auto 80px auto;
      padding: 0 18px;
    }

    /* top bar */
    .topBar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:14px;
    }
    .brandLeft{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .brandPill{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      box-shadow: 0 10px 22px rgba(0,0,0,.25);
      white-space: nowrap;
    }
    .brandPill img{
      height: 22px;
      width: auto;
      display:block;
      border-radius: 6px;
      background: rgba(255,255,255,.06);
    }
    .pageTitle{
      margin:0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    /* card */
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    h2{
      margin:0;
      font-size: 18px;
    }
    .sub{
      margin:8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height:1.4;
    }

    label{
      display:block;
      font-size: 12px;
      color: var(--muted);
      margin: 14px 0 6px;
    }
    input{
      width:100%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      color: var(--text);
      padding: 10px 12px;
      outline:none;
    }
    input:focus{
      border-color: rgba(122,162,255,.65);
      box-shadow: 0 0 0 3px rgba(122,162,255,.15);
    }

    .row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width:520px){
      .row{ grid-template-columns: 1fr; }
      .topBar{ flex-direction: column; align-items: flex-start; }
    }

    .btnRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 14px;
    }
    .btn{
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.07);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight:600;
    }
    .btn:hover{ background: rgba(255,255,255,.12); }
    .btn.primary{
      background: rgba(122,162,255,.22);
      border-color: rgba(122,162,255,.5);
    }
    .btn.primary:hover{ background: rgba(122,162,255,.30); }

    .hint{
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
      line-height:1.4;
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(18,26,51,.95);
      border: 1px solid rgba(255,255,255,.14);
      padding: 10px 12px;
      border-radius: 12px;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      font-size: 13px;
      opacity: 0;
      pointer-events:none;
      transition: opacity .18s ease;
      z-index: 5;
    }
    .toast.show{ opacity: 1; }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- Top: Left brand, Right login -->
    <div class="topBar">
      <div class="brandLeft">
        <div class="brandPill">
          <img src="./assets/logo.png" alt="PVR Cloud Tech">
        </div>
      </div>

      <!-- Only "Login" (no text under it) -->
      <h1 class="pageTitle">Login</h1>
    </div>

    <div class="card">
      <h2>Candidate Verification</h2>
      <p class="sub">Enter your details, verify your email via OTP (valid for 5 minutes), and then start the test.</p>

      <label for="name">Full Name</label>
      <input id="name" type="text" placeholder="e.g., Srinivas" />

      <label for="email">Email Address</label>
      <input id="email" type="email" placeholder="e.g., srinivas@gmail.com" />

      <label for="phone">WhatsApp Number</label>
      <input id="phone" type="tel" inputmode="numeric" placeholder="10-digit mobile number" />

      <div class="btnRow">
        <button class="btn primary" id="btnSendOtp">Send OTP to Mail</button>
      </div>

      <div class="row">
        <div>
          <label for="otp">OTP</label>
          <input id="otp" type="text" inputmode="numeric" placeholder="6-digit OTP" />
        </div>
        <div style="display:flex; align-items:end;">
          <button class="btn primary" id="btnVerify" style="width:100%;">Verify &amp; Continue</button>
        </div>
      </div>

      <div class="hint">
        • OTP expires in 5 minutes<br/>
        • You can attempt the test max <b>3 times per day</b> per email
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxG_H5akM4oMMvRRVf3DXsM6qc-zltVyC3noSqO6LTTEXwqiQYFISTmKaS-XFkCwGh/exec";
  const SECRET_KEY = "PVR_MCQ_interview_2026";

  const elName = document.getElementById('name');
  const elEmail = document.getElementById('email');
  const elPhone = document.getElementById('phone');
  const elOtp = document.getElementById('otp');

  const btnSendOtp = document.getElementById('btnSendOtp');
  const btnVerify = document.getElementById('btnVerify');

  const toast = document.getElementById('toast');
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1600);
  }

  function isValidEmail(email){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }
  function isIndiaPhone10(phone){
    return /^[6-9]\d{9}$/.test(phone);
  }

  async function post(action, extra){
    const payload = Object.assign({ secret: SECRET_KEY, action }, extra || {});
    let res;
    try {
      res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        redirect: "follow"
      });
    } catch (err) {
      showToast("Fetch failed: " + err.message);
      throw err;
    }

    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch {
      return { ok:false, error: "Non-JSON response: " + text.slice(0, 160) };
    }
  }

  btnSendOtp.addEventListener('click', async () => {
    const name = (elName.value || '').trim();
    const email = (elEmail.value || '').trim();
    const phone = (elPhone.value || '').trim();

    if (!name) return showToast("Please enter full name.");
    if (!email) return showToast("Please enter email address.");
    if (!isValidEmail(email)) return showToast("Please enter a valid email.");
    if (!phone) return showToast("Please enter mobile number.");
    if (!isIndiaPhone10(phone)) return showToast("Enter valid 10-digit India mobile.");

    try{
      showToast("Sending OTP...");
      const data = await post("sendOtp", { name, email, phone });
      if (data && data.ok) showToast("OTP sent to email");
      else showToast(data.error || "OTP send failed");
    } catch(e){
      showToast("Network error");
    }
  });

  btnVerify.addEventListener('click', async () => {
    const name = (elName.value || '').trim();
    const email = (elEmail.value || '').trim();
    const phone = (elPhone.value || '').trim();
    const otp = (elOtp.value || '').trim();

    if (!name) return showToast("Please enter full name.");
    if (!email) return showToast("Please enter email address.");
    if (!isValidEmail(email)) return showToast("Please enter a valid email.");
    if (!phone) return showToast("Please enter mobile number.");
    if (!isIndiaPhone10(phone)) return showToast("Enter valid 10-digit India mobile.");
    if (!otp) return showToast("Please enter OTP.");
    if (!/^\d{6}$/.test(otp)) return showToast("OTP must be 6 digits.");

    try{
      showToast("Verifying...");
      const data = await post("verifyOtp", { name, email, phone, otp });
      if (data && data.ok && data.sessionToken) {
        sessionStorage.setItem("pvr_sessionToken", data.sessionToken);
        sessionStorage.setItem("pvr_candidateName", data.name || name);
        sessionStorage.setItem("pvr_candidateEmail", data.email || email);
        sessionStorage.setItem("pvr_candidatePhone", data.phone || phone);
        sessionStorage.setItem("pvr_loginAt", String(Date.now()));
        showToast("Verified. Redirecting...");
        setTimeout(()=> window.location.href = "index.html", 500);
      } else {
        showToast(data.error || "Verification failed");
      }
    } catch(e){
      showToast("Network error");
    }
  });
</script>
</body>
</html>
