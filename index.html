
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADF MCQ Test</title>
  <style>
    /* Watermark background */
body::before{
  content:"";
  position: fixed;
  inset: 0;
  background: url("./assets/watermark.png") center/420px no-repeat;
  opacity: 0.06;          /* adjust: 0.04 to 0.10 */
  pointer-events: none;
  z-index: 0;
}

/* Keep your actual content above watermark */
.wrap { position: relative; z-index: 1; }

    :root { --bg:#0b1020; --card:#121a33; --text:#e8ecff; --muted:#aab3d6; --accent:#7aa2ff; --danger:#ff6b6b; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #18214a 0%, var(--bg) 55%), var(--bg); color: var(--text); }
    .wrap {
  max-width: 960px;
  margin: 64px auto 80px auto;   /* more top margin */
  padding: 0 20px;
}
    .header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom: 14px; }
    h1 { margin:0; font-size: 22px; }
    .sub { margin:6px 0 0; color: var(--muted); font-size: 13px; }
    .pill { font-size: 12px; color: var(--muted); border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18); padding: 6px 10px; border-radius: 999px; }
    .card { background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10); border-radius: 18px; padding: 16px; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
    label { display:block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    input, select {
      width:100%; border-radius: 12px; border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20); color: var(--text); padding: 10px 12px; outline:none;
    }
    input:focus, select:focus { border-color: rgba(122,162,255,.65); box-shadow: 0 0 0 3px rgba(122,162,255,.15); }
    .row { display:grid; grid-template-columns: 1fr; gap:12px; }
    @media (min-width: 860px){ .row { grid-template-columns: 1fr 1fr; } }
    .divider { height:1px; background: rgba(255,255,255,.10); margin: 14px 0; }
    .qbox { padding: 14px; border-radius: 16px; border:1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.18); }
    .qtitle { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .qtitle h2 { margin:0; font-size: 16px; }
    .meta { color: var(--muted); font-size: 12px; }
    .qtext { margin: 10px 0 0; font-size: 14px; line-height:1.45; white-space:pre-wrap; }
    .options { margin-top: 10px; display:grid; gap:10px; }
    .opt {
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .opt input { width:auto; margin-top: 2px; }
    .opt:hover { background: rgba(255,255,255,.06); }
    .brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  height: 46px;
  width: auto;
  padding: 6px;
  border-radius: 10px;

  /* contrast boost */
  background: rgba(255,255,255,0.08);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.12),
    0 8px 20px rgba(0,0,0,0.4);
}

.brandText h1 {
  margin: 0;
}

.brandText .sub {
  margin-top: 4px;
}
@media (max-width:520px){
  .logo{ height:38px; }
}
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; margin-top: 12px; }
    .btn { border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.07); color: var(--text);
      padding: 10px 12px; border-radius: 12px; cursor:pointer; font-weight:600; }
    .btn:hover { background: rgba(255,255,255,.12); }
    .btn.primary { background: rgba(122,162,255,.22); border-color: rgba(122,162,255,.5); }
    .btn.primary:hover { background: rgba(122,162,255,.30); }

    .resultBox { margin-top:12px; padding:12px; border-radius: 14px; border:1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.18); }
    .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      background: rgba(18,26,51,.95); border: 1px solid rgba(255,255,255,.14);
      padding: 10px 12px; border-radius: 12px; box-shadow: 0 10px 22px rgba(0,0,0,.35);
      font-size: 13px; opacity: 0; pointer-events:none; transition: opacity .18s ease; }
    .toast.show { opacity: 1; }

    /* Confirm modal */
    .modalBackdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 9999;       
}
    .modal {
      width: min(520px, 100%);
      background: rgba(18,26,51,.98);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 14px 40px rgba(0,0,0,.45);
    }
    .modal h3 { margin:0 0 8px; font-size: 16px; }
    .modal p { margin:0; color: var(--muted); line-height: 1.45; }
    .modalBtns { display:flex; gap:10px; justify-content:flex-end; margin-top: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
  <div class="brand">
    <img src="./assets/logo.png" class="logo" alt="PVR Cloud Tech">
    <div class="brandText">
      <h1>Interview Questions Practice Tool</h1>
      <p class="sub">Shuffle questions, collect answers, and download a single text file per candidate.</p>
    </div>
  </div>
  <div class="pill" id="statusPill">Not started</div>
</div>

    <div class="card">
      <div class="row">
  <div>
    <label for="candidateName">Candidate name</label>
    <input id="candidateName" type="text" placeholder="e.g., Srinivas" />
  </div>

  <div>
    <label for="candidatePhone">Phone number</label>
    <input id="candidatePhone" type="text" placeholder="e.g., 9876543210" />
  </div>

  <div>
    <label for="candidateEmail">Email ID</label>
    <input id="candidateEmail" type="text" placeholder="e.g., name@gmail.com" />
  </div>

  <div>
    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="basic">Basic</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>
  </div>
</div>


      <div class="divider"></div>

      <div class="qbox">
        <div class="qtitle">
          <h2>Question</h2>
          <div class="meta" id="qMeta">0 / 0</div>
        </div>
        <div class="qtext" id="qText">Click <b>Start</b> to begin.</div>
        <div class="options" id="options"></div>

        <div class="toolbar">
          <button class="btn" id="btnStart">Start</button>
          <button class="btn" id="btnPrev" disabled>Previous</button>
          <button class="btn primary" id="btnNext" disabled>Save & Next</button>
          <button class="btn primary" id="btnComplete" disabled>Complete</button>
        </div>

        <div class="resultBox" id="resultBox" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Confirm modal -->
  <div class="modalBackdrop" id="confirmBackdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>Confirm Submission</h3>
      <p id="confirmText"></p>
      <div class="modalBtns">
        <button type="button" class="btn" id="btnGoBack">Go back</button>
        <button type="button" class="btn primary" id="btnSubmitAnyway">Submit</button>
      </div>
    </div>
  </div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybwb64eeuRUTkSRCEMBog02YA-q5NhJPx9hnKgmlaSN_x04_OOPeKtIsrXxqz1MEY/exec";
  const SECRET_KEY = "PVR_MCQ_interview_2026";
  const QUESTIONS_PER_TEST = 25;
  const PASS_PERCENT = 80;
  const FINAL_SAVE_MESSAGE = "Answers saved. If needed please contact to PVRCLOUDTECH.";

  // DOM
  const elName = candidateName;
  const elPhone = candidatePhone;
  const elEmail = candidateEmail;
  const elDiff = difficulty;
  const elQText = qText;
  const elQMeta = qMeta;
  const elOpts = options;
  const elPill = statusPill;
  const elResult = resultBox;
  const toast = document.getElementById("toast");

  const btnStart = btnStart;
  const btnPrev = btnPrev;
  const btnNext = btnNext;
  const btnComplete = btnComplete;

  const confirmBackdrop = confirmBackdrop;
  const confirmText = confirmText;
  const btnGoBack = btnGoBack;
  const btnSubmitAnyway = btnSubmitAnyway;

  // State
  let selected = [];
  let chosen = {};
  let idx = -1;
  let started = false;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),1800);
  }

  function validateCandidateDetails(){
    const missing = [];
    if(!elName.value.trim()) missing.push("candidate name");
    if(!elPhone.value.trim()) missing.push("phone number");
    if(!elEmail.value.trim()) missing.push("mail id");

    if(missing.length){
      showToast(`Please enter ${missing.join(", ")}.`);
      return false;
    }
    return true;
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i+1);
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  async function loadQuestionBank(diff){
    const map = {
      basic:"./data/adf_basic.json",
      intermediate:"./data/adf_intermediate.json",
      advanced:"./data/adf_advanced.json"
    };
    const res = await fetch(map[diff]+"?v="+Date.now());
    if(!res.ok) throw new Error("JSON load failed");
    return res.json();
  }

  function buildAttempt(bank){
    return shuffle(bank).slice(0,QUESTIONS_PER_TEST).map((q)=>{
      const opts = shuffle(q.opts.map((t,i)=>({t,i})));
      return {
        q:q.q,
        opts:opts.map(o=>o.t),
        correct:opts.findIndex(o=>o.i===q.correct)
      };
    });
  }

  function countAnswered(){
    return Object.keys(chosen).length;
  }

  function render(){
    if(!started){
      elQText.innerHTML="Click <b>Start</b> to begin.";
      elQMeta.textContent="0 / 0";
      elOpts.innerHTML="";
      return;
    }
    const q = selected[idx];
    elQText.textContent=q.q;
    elQMeta.textContent=`${idx+1} / ${selected.length}`;
    elOpts.innerHTML=q.opts.map((t,i)=>`
      <label class="opt">
        <input type="radio" name="opt" value="${i}" ${chosen[idx]===i?"checked":""}>
        <div>${t}</div>
      </label>
    `).join("");

    document.querySelectorAll('input[name="opt"]').forEach(r=>{
      r.onchange=e=>{
        chosen[idx]=+e.target.value;
        elPill.textContent=`In progress: ${countAnswered()}/${selected.length} answered`;
      };
    });
  }

  function openConfirmModal(answered){
    confirmText.textContent =
      `You have answered ${answered} out of ${selected.length} questions. ` +
      `${selected.length-answered} question(s) are not answered yet. Are you sure you want to submit?`;
    document.body.style.overflow="hidden";
    confirmBackdrop.style.display="flex";
  }

  function closeConfirmModal(){
    confirmBackdrop.style.display="none";
    document.body.style.overflow="";
  }

  function computeScore(){
    let c=0;
    selected.forEach((q,i)=>{ if(chosen[i]===q.correct) c++; });
    return Math.round((c/selected.length)*100);
  }

  async function finalizeSubmit(){
    closeConfirmModal();
    const percent = computeScore();
    elResult.style.display="block";
    elResult.innerHTML=`
      <b>Result</b><br>
      Percentage: <b>${percent}%</b><br><br>
      ${percent>=PASS_PERCENT
        ?`Congratulations! You passed the ADF test.`
        :`Thanks for taking the test. Your score is ${percent}%. Please practice and try again.`}
      <br><br>${FINAL_SAVE_MESSAGE}
    `;
    showToast("Submitted successfully");
  }

  // Events
  btnStart.onclick=async()=>{
    if(!validateCandidateDetails()) return;
    const bank=await loadQuestionBank(elDiff.value);
    selected=buildAttempt(bank);
    chosen={}; idx=0; started=true;
    render();
  };

  btnPrev.onclick=()=>{ if(idx>0){idx--;render();}};
  btnNext.onclick=()=>{ if(chosen[idx]!=null){idx++;render();} else showToast("Select an option"); };
  btnComplete.onclick=()=>{
    const answered=countAnswered();
    answered<selected.length ? openConfirmModal(answered) : finalizeSubmit();
  };
  btnGoBack.onclick=closeConfirmModal;
  btnSubmitAnyway.onclick=finalizeSubmit;
</script>
</body>
</html>
