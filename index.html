<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADF MCQ Test</title>
  <style>

    /* ===== Better dropdown styling (difficulty) ===== */
#difficulty{
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;

  background: rgba(18,26,51,.88);               /* glass card bg */
  border: 1px solid rgba(255,255,255,.18);
  color: var(--text);

  padding-right: 42px;                          /* space for arrow */
  box-shadow: 0 10px 22px rgba(0,0,0,.25);
}

/* custom arrow */
#difficulty{
  background-image:
    linear-gradient(45deg, transparent 50%, rgba(232,236,255,.85) 50%),
    linear-gradient(135deg, rgba(232,236,255,.85) 50%, transparent 50%);
  background-position:
    calc(100% - 18px) 55%,
    calc(100% - 12px) 55%;
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
}

#difficulty:hover{
  border-color: rgba(122,162,255,.55);
}

#difficulty:focus{
  border-color: rgba(122,162,255,.70);
  box-shadow: 0 0 0 3px rgba(122,162,255,.18), 0 12px 26px rgba(0,0,0,.35);
}

/* options list (best effort; OS may still control some parts) */
#difficulty option{
  background: #121a33;        /* solid so text is readable */
  color: #e8ecff;
  padding: 10px;
}

/* better highlight (some browsers ignore) */
#difficulty option:checked,
#difficulty option:hover{
  background: #1b2a55;
  color: #ffffff;
}
    
    /* Watermark background */
body::before{
  content:"";
  position: fixed;
  inset: 0;
  background: url("./assets/watermark.png") center/420px no-repeat;
  opacity: 0.06;          /* adjust: 0.04 to 0.10 */
  pointer-events: none;
  z-index: 0;
}

/* Keep your actual content above watermark */
.wrap { position: relative; z-index: 1; }

    :root { --bg:#0b1020; --card:#121a33; --text:#e8ecff; --muted:#aab3d6; --accent:#7aa2ff; --danger:#ff6b6b; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #18214a 0%, var(--bg) 55%), var(--bg); color: var(--text); }
    .wrap {
  max-width: 960px;
  margin: 64px auto 80px auto;   /* more top margin */
  padding: 0 20px;
}
    .header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom: 14px; }
    h1 { margin:0; font-size: 22px; }
    .sub { margin:6px 0 0; color: var(--muted); font-size: 13px; }
    .pill { font-size: 12px; color: var(--muted); border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18); padding: 6px 10px; border-radius: 999px; }
    .card { background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10); border-radius: 18px; padding: 16px; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
    label { display:block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    input, select {
      width:100%; border-radius: 12px; border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20); color: var(--text); padding: 10px 12px; outline:none;
    }
    input:focus, select:focus { border-color: rgba(122,162,255,.65); box-shadow: 0 0 0 3px rgba(122,162,255,.15); }
    .row { display:grid; grid-template-columns: 1fr; gap:12px; }
    @media (min-width: 860px){ .row { grid-template-columns: 1fr 1fr; } }
    .divider { height:1px; background: rgba(255,255,255,.10); margin: 14px 0; }
    .qbox { padding: 14px; border-radius: 16px; border:1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.18); }
    .qtitle { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .qtitle h2 { margin:0; font-size: 16px; }
    .meta { color: var(--muted); font-size: 12px; }
    .qtext { margin: 10px 0 0; font-size: 14px; line-height:1.45; white-space:pre-wrap; }
    .options { margin-top: 10px; display:grid; gap:10px; }
    .opt {
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .opt input { width:auto; margin-top: 2px; }
    .opt:hover { background: rgba(255,255,255,.06); }
    .brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* ===== Footer bar (index page) ===== */
.footerBar{
  position: fixed;
  left: 0;
  right: 0;
  bottom: 8px;
  display:flex;
  justify-content:space-between;
  gap: 10px;
  padding: 0 18px;
  color: rgba(232,236,255,.85);
  font-size: 12px;
  z-index: 2;
  pointer-events: none;
}
.footerStrong{ color: #e8ecff; font-weight: 600; }

/* Confirm modal - FIX stacking */
.modalBackdrop{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 9999;     /*  important */
}

.modal{
  position: relative;
  z-index: 10000;    /*  optional but good */
}
    
.logo {
  height: 46px;
  width: auto;
  padding: 6px;
  border-radius: 10px;

  /* contrast boost */
  background: rgba(255,255,255,0.08);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.12),
    0 8px 20px rgba(0,0,0,0.4);
}

.brandText h1 {
  margin: 0;
}

.brandText .sub {
  margin-top: 4px;
}
@media (max-width:520px){
  .logo{ height:38px; }
}
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; margin-top: 12px; }
    .btn { border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.07); color: var(--text);
      padding: 10px 12px; border-radius: 12px; cursor:pointer; font-weight:600; }
    .btn:hover { background: rgba(255,255,255,.12); }
    .btn.primary { background: rgba(122,162,255,.22); border-color: rgba(122,162,255,.5); }
    .btn.primary:hover { background: rgba(122,162,255,.30); }

    .resultBox { margin-top:12px; padding:12px; border-radius: 14px; border:1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.18); }
    .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      background: rgba(18,26,51,.95); border: 1px solid rgba(255,255,255,.14);
      padding: 10px 12px; border-radius: 12px; box-shadow: 0 10px 22px rgba(0,0,0,.35);
      font-size: 13px; opacity: 0; pointer-events:none; transition: opacity .18s ease; }
    .toast.show { opacity: 1; }

    /* Confirm modal */
    .modalBackdrop { position: fixed; inset:0; background: rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:16px; }
    .modal { width: min(520px, 100%); background: rgba(18,26,51,.98); border:1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
    .modal h3 { margin:0 0 8px; font-size: 16px; }
    .modal p { margin:0; color: var(--muted); line-height: 1.45; }
    .modalBtns { display:flex; gap:10px; justify-content:flex-end; margin-top: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
  <div class="brand">
    <img src="./assets/logo.png" class="logo" alt="PVR Cloud Tech">
    <div class="brandText">
      <h1>Azure Data Factory Interview Assessment</h1>
      <p class="sub">Select level and start the assessment.</p>
    </div>
  </div>
  <div class="pill" id="statusPill">Not started</div>
</div>

    <div class="card">
      <div class="row">
  <div>
    <label for="candidateName">Candidate Name</label>
    <input id="candidateName" type="text" placeholder="e.g., Srinivas" />
  </div>

  <div>
    <label for="candidateEmail">Email Address</label>
    <input id="candidateEmail" type="email" placeholder="e.g., srinivas@gmail.com" />
  </div>

  <div>
    <label for="candidatePhone">WhatsApp Number</label>
    <input id="candidatePhone" type="tel" placeholder="e.g., 9876543210" />
  </div>

  <div>
    <label for="difficulty">Select Level</label>
    <select id="difficulty">
      <option value="BASIC">Basic</option>
      <option value="INTERMEDIATE">Intermediate</option>
      <option value="ADVANCED">Advanced</option>
    </select>
  </div>
</div>

      <div class="divider"></div>

      <div class="qbox">
        <div class="qtitle">
          <h2>Question</h2>
          <div class="meta" id="qMeta">0 / 0</div>
        </div>
        <div class="qtext" id="qText">Click <b>Start</b> to begin.</div>
        <div class="options" id="options"></div>

        <div class="toolbar">
          <button class="btn" id="btnStart">Start</button>
          <button class="btn primary" id="btnComplete" disabled>Complete</button>
        </div>

        <div class="resultBox" id="resultBox" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Confirm modal -->
  <div class="modalBackdrop" id="confirmBackdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>Confirm Submission</h3>
      <p id="confirmText"></p>
      <div class="modalBtns">
        <button class="btn" id="btnGoBack">Go back</button>
        <button class="btn primary" id="btnSubmitAnyway">Submit</button>
      </div>
    </div>
  </div>

<script>
  
  // ====== SET THESE ======
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxG_H5akM4oMMvRRVf3DXsM6qc-zltVyC3noSqO6LTTEXwqiQYFISTmKaS-XFkCwGh/exec";
  const SECRET_KEY = "PVR_MCQ_interview_2026"; // must match Apps Script

  async function post(action, extra){
  const payload = Object.assign({ secret: SECRET_KEY, action }, extra || {});
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
    redirect: "follow"
  });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch { return { ok:false, error:"Non-JSON response: " + text.slice(0,160) }; }
}

  function isRefreshNavigation(){
  const nav = performance.getEntriesByType("navigation")[0];
  if (nav && nav.type) return nav.type === "reload";
  return performance.navigation && performance.navigation.type === 1;
  }

  const SESSION_TOKEN = sessionStorage.getItem("pvr_sessionToken");

  // ====== DOM ======
  const elName = document.getElementById('candidateName');
  const elEmail = document.getElementById('candidateEmail');
  const elPhone = document.getElementById('candidatePhone');
  const elDiff = document.getElementById('difficulty');
  const elQText = document.getElementById('qText');
  const elQMeta = document.getElementById('qMeta');
  const elOpts = document.getElementById('options');
  const elPill = document.getElementById('statusPill');
  const elResult = document.getElementById('resultBox');
  const toast = document.getElementById('toast');

  const btnStart = document.getElementById('btnStart');
  const btnComplete = document.getElementById('btnComplete');

  const confirmBackdrop = document.getElementById('confirmBackdrop');
  const confirmText = document.getElementById('confirmText');
  const btnGoBack = document.getElementById('btnGoBack');
  const btnSubmitAnyway = document.getElementById('btnSubmitAnyway');
  
  // Start disabled until server validates
    btnStart.disabled = true;
    
    async function hardGuard(){
      if (!SESSION_TOKEN) {
        window.location.href = "login.html";
        return;
      }
    
      // HARD validation via Apps Script
      const v = await post("validateSession", { sessionToken: SESSION_TOKEN });
    
      if (!v || !v.ok) {
        sessionStorage.clear();
        window.location.href = "login.html";
        return;
      }
    
      // optional: refresh values from server truth
      elName.value  = v.name || elName.value;
      elEmail.value = v.email || elEmail.value;
      elPhone.value = v.phone || elPhone.value;
    
      // lock inputs
      elName.readOnly = true;
      elEmail.readOnly = true;
      elPhone.readOnly = true;
    
      // allow Start now
      btnStart.disabled = false;
    }

  async function restoreOrAutosubmitOnRefresh(){
    const wasInProgress = sessionStorage.getItem("pvr_test_inprogress") === "1";
    const wasStarted = sessionStorage.getItem("pvr_test_started") === "1";
    const nav = performance.getEntriesByType("navigation")[0];
    const isReload = nav ? nav.type === "reload" : (performance.navigation && performance.navigation.type === 1);
  
    if (!(wasInProgress && wasStarted && isReload)) return;  // nothing to do
  
    // restore state
    try{
      lockedDifficulty = sessionStorage.getItem("pvr_test_lockedDifficulty") || "BASIC";
      selected = JSON.parse(sessionStorage.getItem("pvr_test_selected") || "[]");
      chosen = JSON.parse(sessionStorage.getItem("pvr_test_chosen") || "{}");
      idx = Number(sessionStorage.getItem("pvr_test_idx") || "0");
      started = true;
    }catch(e){
      // if restore fails just go login
      sessionStorage.clear();
      window.location.href = "login.html";
      return;
    }
  
    // lock dropdown
    elDiff.value = lockedDifficulty;
    elDiff.disabled = true;
  
    // show message & submit automatically
    showToast("Refreshing detected. Auto-submitting your answers...");
    isAutoSubmitting = true;
  
    try{
      await finalizeSubmit(); // this already submits + redirects to results.html (in your current code)
    }catch(e){
      // if submit fails, force login
      sessionStorage.clear();
      window.location.href = "login.html";
    }
  }

    // Run guard immediately
    hardGuard().then(() => {
      restoreOrAutosubmitOnRefresh();
    });

  const PASS_PERCENT = 80;
  const FINAL_SAVE_MESSAGE = "Answers saved. If needed please contact to PVRCLOUDTECH.";

  // =========================

    sessionStorage.setItem("pvr_test_lockedDifficulty", lockedDifficulty || "");
    sessionStorage.setItem("pvr_test_selected", JSON.stringify(selected || []));
    sessionStorage.setItem("pvr_test_chosen", JSON.stringify(chosen || {}));
    sessionStorage.setItem("pvr_test_idx", String(idx));
    sessionStorage.setItem("pvr_test_started", started ? "1" : "0");
  }catch(e){}
}

  function setButtons(){
    btnComplete.disabled = !started || selected.length === 0;
  }

  function countAnswered(){
    return Object.keys(chosen).filter(k => Number.isInteger(chosen[k])).length;
  }

  function setPill(){
    if (!started) return elPill.textContent = "Not started";
    const answered = countAnswered();
    elPill.textContent = `In progress: ${answered}/${selected.length} answered`;
  }

  function createAttemptQuestions(diff){
  // shuffle questions every Start
  const qs = shuffle(BANK[diff]).slice(0, 25);

  // shuffle options for each question and preserve correct mapping
  return qs.map(q => {
    const options = q.opts.map((t, i) => ({ key: i, text: t }));
    const shuffledOpts = shuffle(options);
    const correctIndex = shuffledOpts.findIndex(o => o.key === q.correct);

    return {
      q: q.q,
      opts: shuffledOpts.map(o => o.text),
      correct: correctIndex
    };
  });
}

  function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

  function isValidPhone(phone){
    // allows 10–15 digits (works for most countries); adjust if you want India-only
    return /^[0-9]{10,15}$/.test(phone);
  }


  function render(){
    if (!started || idx < 0) {
      elQText.innerHTML = 'Click <b>Start</b> to begin.';
      elQMeta.textContent = '0 / 0';
      elOpts.innerHTML = '';
      elResult.style.display = "none";
      setButtons();
      setPill();
      return;
    }

    const q = selected[idx];
    elQText.textContent = q.q;
    updateMetaWithTimer();

    const picked = chosen[idx];
    elOpts.innerHTML = q.opts.map((t, oi) => {
      const checked = picked === oi ? 'checked' : '';
      return `
        <label class="opt">
          <input type="radio" name="opt" value="${oi}" ${checked}/>
          <div>${t}</div>
        </label>
      `;
    }).join('');

    elOpts.querySelectorAll('input[name="opt"]').forEach(r => {
      r.addEventListener('change', (e) => {
        chosen[idx] = Number(e.target.value);
        saveProgress();
        setPill();
        setTimeout(() => {
        stopTimer();
        autoNext();
      }, 250);
      });
    });

    setButtons();
    setPill();
  }

  function computeScore(){
    let correct = 0;
    selected.forEach((q, i) => {
      if (chosen[i] === q.correct) correct++;
    });
    const total = selected.length;
    const percent = total ? Math.round((correct / total) * 100) : 0;
    return { correct, total, percent };
  }

  function passFailMessage(percent, difficulty){
    if (percent >= PASS_PERCENT) {
      return `Congratulations! You passed the ADF ${difficulty.toLowerCase()} test. Keep up the great work and continue strengthening your ADF fundamentals.`;
    }
    // Suggested best message for below 80%
    return `Thanks for taking the test. Your score is ${percent}%. Don’t worry—review the topics you missed, practice a bit more, and try again. Consistency will get you there.`;
  }

  async function submitToGoogle(){

    const difficulty = lockedDifficulty;
    const { correct, total, percent } = computeScore();

    const questionsPayload = selected.map((q, i) => {
      const selectedIndex = chosen[i];
      return {
        order: i + 1,
        question: q.q,
        selectedIndex: Number.isInteger(selectedIndex) ? selectedIndex : null,
        selectedText: Number.isInteger(selectedIndex) ? q.opts[selectedIndex] : null,
        correctIndex: q.correct,
        correctText: q.opts[q.correct],
        isCorrect: Number.isInteger(selectedIndex) && selectedIndex === q.correct
      };
    });

    const payload = {
      secret: SECRET_KEY,
      action: "submitTest",
      sessionToken: SESSION_TOKEN,
      difficulty,
      total,
      correct,
      percent,
      questions: questionsPayload
    };

    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

    const txt = await res.text();
    try { return JSON.parse(txt); }
    catch { return { ok:false, error:"Non-JSON response: " + txt.slice(0,160) }; }

  }

  function openConfirmModal(answered, notAnswered){
    confirmText.textContent =
      `You have answered ${answered} out of ${selected.length} questions. ` +
      `${notAnswered} question(s) are not answered yet. Are you sure you want to submit?`;
    confirmBackdrop.style.display = "flex";
  }

  function closeConfirmModal(){
    confirmBackdrop.style.display = "none";
  }

  function normalizePhone(p){
  let x = String(p||"").replace(/\D/g,"");
  if (x.length === 10) x = "91" + x;      // assume India
  return x;
}

  async function finalizeSubmit(){
  stopTimer();
  const difficulty = lockedDifficulty;
  const { correct, total, percent } = computeScore();

  // Show result box instantly
  elResult.style.display = "block";
  elResult.innerHTML = `
    <b>Result</b><br/>
    Score: <b>${correct}/${total}</b><br/>
    Percentage: <b>${percent}%</b><br/><br/>
    <span>${passFailMessage(percent, difficulty)}</span><br/><br/>
    <span>${FINAL_SAVE_MESSAGE}</span>
  `;

  try {
    showToast("Submitting...");
    const data = await submitToGoogle();

    if (data && data.ok) {
      showToast("Submitted successfully");

      sessionStorage.removeItem("pvr_test_inprogress");
      sessionStorage.removeItem("pvr_test_lockedDifficulty");
      sessionStorage.removeItem("pvr_test_selected");
      sessionStorage.removeItem("pvr_test_chosen");
      sessionStorage.removeItem("pvr_test_idx");
      sessionStorage.removeItem("pvr_test_started");


      // Save result for results.html
      sessionStorage.setItem("pvr_lastResult", JSON.stringify({
        name: elName.value,
        email: elEmail.value,
        phone: normalizePhone(elPhone.value),
        difficulty,
        correct,
        total,
        percent
      }));

      // LOGOUT (remove login session)
      sessionStorage.removeItem("pvr_sessionToken");
      sessionStorage.removeItem("pvr_candidateName");
      sessionStorage.removeItem("pvr_candidateEmail");
      sessionStorage.removeItem("pvr_candidatePhone");
      sessionStorage.removeItem("pvr_loginAt");

      // Go to results page
      window.location.href = "results.html";
      return;
    } else {
      showToast(data.error || "Submit failed");
      elResult.innerHTML += `<br/><br/> Submit failed. Please try again.`;
    }
  } catch (e) {
    showToast("Network error");
    elResult.innerHTML += `<br/><br/> Network error. Please try again.`;
  }
}

  // ====== Events ======
  btnStart.addEventListener('click', async () => {
      // ensure still valid before starting
      const v = await post("validateSession", { sessionToken: SESSION_TOKEN });
      if (!v || !v.ok) {
        sessionStorage.clear();
        window.location.href = "login.html";
        return;
      }
    
      lockedDifficulty = (elDiff.value || "BASIC").toUpperCase();

        // lock dropdown
        elDiff.disabled = true;
        elDiff.style.opacity = "0.7";
        elDiff.style.cursor = "not-allowed";
        
        const bank = BANK[lockedDifficulty];
        if (!bank || bank.length < 25) {
          showToast("Question bank is incomplete for this difficulty.");
          return;
        }
        
        selected = createAttemptQuestions(lockedDifficulty);
        chosen = {};
        idx = 0;
        started = true;
        saveProgress();
        elResult.style.display = "none";
        elResult.innerHTML = "";
        
        showToast(`Started: ${selected.length} questions (${lockedDifficulty})`);
        render();
        startTimer();
        
        // once started, disable Start to prevent restart
        btnStart.disabled = true;

    });

  // Prevent difficulty change after test starts (extra safety)
  elDiff.addEventListener("change", () => {
    if (started && lockedDifficulty) {
      elDiff.value = lockedDifficulty;
      showToast("Difficulty cannot be changed once the test starts.");
    }
  });

  btnComplete.addEventListener('click', () => {
    if (!started || selected.length === 0) return;
  
    const answered = countAnswered();
    const notAnswered = selected.length - answered;
  
    // If not all answered, show confirm popup
    if (notAnswered > 0) {
      openConfirmModal(answered, notAnswered);
      return;
    }
  
    // If all answered, submit directly (or you can still confirm if you want)
    finalizeSubmit();
  });

  btnGoBack.addEventListener('click', () => {
    closeConfirmModal();
  });

  btnSubmitAnyway.addEventListener('click', () => {
    closeConfirmModal();
    finalizeSubmit();
  });

  render();
</script>
