<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADF MCQ Test</title>
  <style>
    :root { --bg:#0b1020; --card:#121a33; --text:#e8ecff; --muted:#aab3d6; --accent:#7aa2ff; --danger:#ff6b6b; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #18214a 0%, var(--bg) 55%), var(--bg); color: var(--text); }
    .wrap { max-width: 920px; margin: 28px auto; padding: 0 16px; }
    .header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom: 14px; }
    h1 { margin:0; font-size: 22px; }
    .sub { margin:6px 0 0; color: var(--muted); font-size: 13px; }
    .pill { font-size: 12px; color: var(--muted); border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18); padding: 6px 10px; border-radius: 999px; }
    .card { background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10); border-radius: 18px; padding: 16px; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
    label { display:block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    input, select {
      width:100%; border-radius: 12px; border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20); color: var(--text); padding: 10px 12px; outline:none;
    }
    input:focus, select:focus { border-color: rgba(122,162,255,.65); box-shadow: 0 0 0 3px rgba(122,162,255,.15); }
    .row { display:grid; grid-template-columns: 1fr; gap:12px; }
    @media (min-width: 860px){ .row { grid-template-columns: 1fr 1fr; } }
    .divider { height:1px; background: rgba(255,255,255,.10); margin: 14px 0; }
    .qbox { padding: 14px; border-radius: 16px; border:1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.18); }
    .qtitle { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .qtitle h2 { margin:0; font-size: 16px; }
    .meta { color: var(--muted); font-size: 12px; }
    .qtext { margin: 10px 0 0; font-size: 14px; line-height:1.45; white-space:pre-wrap; }
    .options { margin-top: 10px; display:grid; gap:10px; }
    .opt {
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .opt input { width:auto; margin-top: 2px; }
    .opt:hover { background: rgba(255,255,255,.06); }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; margin-top: 12px; }
    .btn { border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.07); color: var(--text);
      padding: 10px 12px; border-radius: 12px; cursor:pointer; font-weight:600; }
    .btn:hover { background: rgba(255,255,255,.12); }
    .btn.primary { background: rgba(122,162,255,.22); border-color: rgba(122,162,255,.5); }
    .btn.primary:hover { background: rgba(122,162,255,.30); }
    .resultBox { margin-top:12px; padding:12px; border-radius: 14px; border:1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.18); }
    .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      background: rgba(18,26,51,.95); border: 1px solid rgba(255,255,255,.14);
      padding: 10px 12px; border-radius: 12px; box-shadow: 0 10px 22px rgba(0,0,0,.35);
      font-size: 13px; opacity: 0; pointer-events:none; transition: opacity .18s ease; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>ADF MCQ Test</h1>
        <p class="sub">Select difficulty, answer MCQs, and submit results to Google Sheet + Drive.</p>
      </div>
      <div class="pill" id="statusPill">Not started</div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <label for="candidateName">Candidate name</label>
          <input id="candidateName" type="text" placeholder="e.g., Rahul Sharma" />
        </div>
        <div>
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="BASIC">Basic</option>
            <option value="INTERMEDIATE">Intermediate</option>
            <option value="ADVANCED">Advanced</option>
          </select>
        </div>
      </div>

      <div class="divider"></div>

      <div class="qbox">
        <div class="qtitle">
          <h2>Question</h2>
          <div class="meta" id="qMeta">0 / 0</div>
        </div>
        <div class="qtext" id="qText">Click <b>Start</b> to begin.</div>
        <div class="options" id="options"></div>

        <div class="toolbar">
          <button class="btn" id="btnStart">Start</button>
          <button class="btn" id="btnPrev" disabled>Previous</button>
          <button class="btn primary" id="btnNext" disabled>Save & Next</button>
          <button class="btn primary" id="btnComplete" disabled>Complete</button>
        </div>

        <div class="resultBox" id="resultBox" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // ====== SET THESE ======
  const APPS_SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
  const SECRET_KEY = "PVR_SECRET_2026"; // must match Apps Script

  // ====== QUESTION BANK (ADF only for now) ======
  // correct = index of options array (0..3)
  const BANK = {
    BASIC: [
      { q: "ADF is primarily used for:", opts: ["Creating VMs", "Data integration & orchestration", "Hosting websites", "Monitoring logs"], correct: 1 },
      { q: "ADF pipeline is a:", opts: ["Storage account", "Logical group of activities", "SQL table", "Compute cluster"], correct: 1 },
      { q: "Linked Service represents:", opts: ["Compute size", "Connection info to a resource", "A schedule trigger", "A dataset schema only"], correct: 1 },
      { q: "Dataset in ADF defines:", opts: ["Where data is stored + structure reference", "Only pricing", "Only trigger type", "Only notebook code"], correct: 0 },
      { q: "Integration Runtime is used to:", opts: ["Run Power BI reports", "Provide compute for data movement/transform", "Store Delta tables", "Run Kubernetes pods"], correct: 1 },
      { q: "Copy Activity is used for:", opts: ["Data movement from source to sink", "Only SQL joins", "Only file encryption", "Only streaming ingestion"], correct: 0 },
      { q: "A trigger in ADF is used to:", opts: ["Start pipelines", "Create tables", "Encrypt files", "Scale clusters"], correct: 0 },
      { q: "Which is a Control Flow activity?", opts: ["ForEach", "Derived Column", "Aggregate", "Sink"], correct: 0 },
      { q: "ADF is:", opts: ["PaaS ETL/ELT service", "IaaS networking service", "Desktop tool", "On-prem DB"], correct: 0 },
      { q: "A pipeline parameter helps to:", opts: ["Hardcode values", "Make pipelines reusable", "Reduce storage", "Disable triggers"], correct: 1 }
    ],
    INTERMEDIATE: [
      { q: "Tumbling Window trigger is best for:", opts: ["Ad-hoc runs only", "Fixed time windows with dependency support", "Only file events", "Manual runs"], correct: 1 },
      { q: "Schema drift in Mapping Data Flow is handled by:", opts: ["Allow schema drift", "Only hard-coded mappings", "Only stored procedures", "Only Copy Activity"], correct: 0 },
      { q: "A common way to pass values from Lookup to pipeline is:", opts: ["@activity('Lookup').output...", "@trigger().name only", "hard-code", "linked service property"], correct: 0 },
      { q: "ForEach in ADF is used to:", opts: ["Create datasets", "Iterate over an array and run activities", "Create triggers", "Scale IR"], correct: 1 },
      { q: "Best practice for secrets in ADF is:", opts: ["Put in pipeline code", "Use Azure Key Vault", "Store in dataset name", "Use Git commit message"], correct: 1 },
      { q: "Which activity is used to call REST APIs?", opts: ["Web activity", "Copy only", "Wait activity", "Filter activity"], correct: 0 },
      { q: "Upsert pattern in ADF often uses:", opts: ["Stored procedure / MERGE", "Only Copy activity", "Only Wait", "Only Until"], correct: 0 },
      { q: "A common cause of Copy performance issues is:", opts: ["Too many partitions/DIUs mis-sized", "Too many labels", "Too many triggers", "Too many folders"], correct: 0 },
      { q: "ADF Managed VNet is used for:", opts: ["Secure private connectivity", "Speeding up Git", "Cheaper storage", "Increasing UI performance"], correct: 0 },
      { q: "Execute Pipeline activity is used to:", opts: ["Call child pipeline", "Create dataset", "Create linked service", "Run SQL query only"], correct: 0 }
    ],
    ADVANCED: [
      { q: "Best approach for dynamic schema evolution in Data Flows:", opts: ["Allow schema drift + rule-based mapping", "Hardcode every column always", "Disable drift and stop pipelines", "Only use Copy Activity"], correct: 0 },
      { q: "How to implement idempotent loads in ADF?", opts: ["Use watermarking/CDC + merge/upsert", "Always full overwrite", "Only append forever", "Disable retries"], correct: 0 },
      { q: "Handling slowly changing dimensions typically involves:", opts: ["SCD Type logic + merge strategy", "Only truncate", "Only delete", "Only copy to CSV"], correct: 0 },
      { q: "For large scale ingestion, recommended design is:", opts: ["Metadata-driven pipelines + parameterized datasets", "One pipeline per file", "Manual runs only", "Hard-coded paths"], correct: 0 },
      { q: "Best way to reduce unnecessary reprocessing:", opts: ["Watermark + incremental loads", "Always rerun full", "Disable triggers", "Copy to temp always"], correct: 0 },
      { q: "In ADF, private endpoints are mainly for:", opts: ["Private access to PaaS without public internet", "Faster CPU", "Cheaper cost", "More UI features"], correct: 0 },
      { q: "Common strategy for error handling at scale:", opts: ["Centralized logging + retry + dead-letter pattern", "Ignore failures", "Stop all triggers", "Hardcode try/catch"], correct: 0 },
      { q: "For orchestrating Databricks notebooks with parameters:", opts: ["ADF Databricks activity + base parameters", "Copy activity", "Wait activity", "Filter activity"], correct: 0 },
      { q: "Best practice to avoid hot partitions in sinks:", opts: ["Repartition/partitionBy with good keys", "Single partition always", "Coalesce to 1 always", "Disable partitioning"], correct: 0 },
      { q: "To support multi-env CI/CD, you should:", opts: ["Use ARM/Bicep + parameterization + DevOps", "Manually edit prod always", "Use one factory only", "Avoid Git integration"], correct: 0 }
    ]
  };

  // ====== State ======
  let selected = [];
  let idx = -1;
  let started = false;
  let chosen = {}; // questionIndex -> selectedOptionIndex (0..3)

  // ====== DOM ======
  const elName = document.getElementById('candidateName');
  const elDiff = document.getElementById('difficulty');
  const elQText = document.getElementById('qText');
  const elQMeta = document.getElementById('qMeta');
  const elOpts = document.getElementById('options');
  const elPill = document.getElementById('statusPill');
  const elResult = document.getElementById('resultBox');
  const toast = document.getElementById('toast');

  const btnStart = document.getElementById('btnStart');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnComplete = document.getElementById('btnComplete');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1600);
  }

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function setButtons(){
    btnPrev.disabled = !started || idx <= 0;
    btnNext.disabled = !started || idx < 0;
    btnComplete.disabled = !started || selected.length === 0;
  }

  function setPill(){
    if (!started) return elPill.textContent = "Not started";
    const answered = Object.keys(chosen).length;
    elPill.textContent = `In progress: ${answered}/${selected.length} answered`;
  }

  function render(){
    if (!started || idx < 0) {
      elQText.innerHTML = 'Click <b>Start</b> to begin.';
      elQMeta.textContent = '0 / 0';
      elOpts.innerHTML = '';
      setButtons();
      setPill();
      return;
    }

    const q = selected[idx];
    elQText.textContent = q.q;
    elQMeta.textContent = `${idx + 1} / ${selected.length}`;

    const picked = chosen[idx]; // selected option index
    elOpts.innerHTML = q.opts.map((t, oi) => {
      const checked = picked === oi ? 'checked' : '';
      return `
        <label class="opt">
          <input type="radio" name="opt" value="${oi}" ${checked}/>
          <div>${t}</div>
        </label>
      `;
    }).join('');

    // handle selection
    elOpts.querySelectorAll('input[name="opt"]').forEach(r => {
      r.addEventListener('change', (e) => {
        chosen[idx] = Number(e.target.value);
        setPill();
      });
    });

    setButtons();
    setPill();
  }

  function computeScore(){
    let correct = 0;
    selected.forEach((q, i) => {
      if (chosen[i] === q.correct) correct++;
    });
    const total = selected.length;
    const percent = total ? Math.round((correct / total) * 100) : 0;
    return { correct, total, percent };
  }

  async function submitToGoogle(){
    const candidate = (elName.value || '').trim();
    if (!candidate) {
      showToast("Please enter candidate name.");
      return { ok:false, error:"Missing candidate name" };
    }

    const difficulty = (elDiff.value || "BASIC").toUpperCase();
    const { correct, total, percent } = computeScore();

    const questionsPayload = selected.map((q, i) => {
      const selectedIndex = chosen[i];
      return {
        order: i + 1,
        question: q.q,
        selectedIndex: Number.isInteger(selectedIndex) ? selectedIndex : null,
        selectedText: Number.isInteger(selectedIndex) ? q.opts[selectedIndex] : null,
        correctIndex: q.correct,
        correctText: q.opts[q.correct],
        isCorrect: Number.isInteger(selectedIndex) && selectedIndex === q.correct
      };
    });

    const payload = {
      secret: SECRET_KEY,
      candidate,
      difficulty,
      total,
      correct,
      percent,
      questions: questionsPayload
    };

    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

    return await res.json();
  }

  // ====== Events ======
  btnStart.addEventListener('click', () => {
    elResult.style.display = "none";
    elResult.innerHTML = "";

    const diff = (elDiff.value || "BASIC").toUpperCase();
    const bank = BANK[diff];

    if (!bank || !bank.length) {
      showToast("No questions for selected difficulty.");
      return;
    }

    selected = shuffle(bank); // shuffle 10
    chosen = {};
    idx = 0;
    started = true;

    showToast(`Started: ${selected.length} questions (${diff})`);
    render();
  });

  btnPrev.addEventListener('click', () => {
    idx = Math.max(0, idx - 1);
    render();
  });

  btnNext.addEventListener('click', () => {
    if (!Number.isInteger(chosen[idx])) {
      showToast("Please select an option before moving next.");
      return;
    }
    if (idx < selected.length - 1) idx += 1;
    render();
  });

  btnComplete.addEventListener('click', async () => {
    // allow complete even if last question not answered? enforce:
    if (!Number.isInteger(chosen[idx])) {
      showToast("Please select an option for this question.");
      return;
    }
    const { correct, total, percent } = computeScore();

    elResult.style.display = "block";
    elResult.innerHTML = `
      <b>Result</b><br/>
      Score: <b>${correct}/${total}</b><br/>
      Percentage: <b>${percent}%</b><br/><br/>
      Submitting to Google...
    `;

    try {
      const data = await submitToGoogle();
      if (data.ok) {
        elResult.innerHTML += `<br/>✅ Saved to Google Drive/Sheet.<br/>File: <a href="${data.fileUrl}" target="_blank" rel="noreferrer">${data.fileName}</a>`;
        showToast("Submitted successfully ✅");
      } else {
        elResult.innerHTML += `<br/> Submit failed: ${data.error || "unknown"}`;
        showToast("Submit failed");
      }
    } catch (e) {
      elResult.innerHTML += `<br/> Network error: ${e.message}`;
      showToast("Network error");
    }
  });

  render();
</script>
</body>
</html>
