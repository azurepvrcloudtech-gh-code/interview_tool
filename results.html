<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Test Result</title>
  <style>
    :root { --bg:#0b1020; --card:#121a33; --text:#e8ecff; --muted:#aab3d6; --accent:#7aa2ff; --danger:#ff6b6b; }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #18214a 0%, var(--bg) 55%), var(--bg);
      color: var(--text);
    }
    body::before{
      content:"";
      position: fixed;
      inset: 0;
      background: url("./assets/watermark.png") center/420px no-repeat;
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }
    .wrap{ position: relative; z-index: 1; max-width: 680px; margin: 70px auto; padding: 0 18px; }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }
    h1{ margin:0; font-size: 20px; }
    .sub{ margin:8px 0 0; color: var(--muted); font-size: 13px; line-height:1.4; }
    .box{
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      line-height: 1.6;
    }
    .btnRow{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 14px; }
    .btn{
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.07);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight:600;
      text-decoration: none;
      display:inline-block;
    }
    .btn.primary{ background: rgba(122,162,255,.22); border-color: rgba(122,162,255,.5); }
    .muted{ color: var(--muted); font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Test Completed</h1>
      <p class="sub">Your result is shown below. This page will auto close in 1 minute.</p>

      <div class="box" id="resultBox">Loading...</div>

      <div class="btnRow">
        <a class="btn primary" id="waLink" href="#" target="_blank">Send WhatsApp Message</a>
        <a class="btn" href="login.html">Login Again</a>
      </div>

      <div class="muted" id="closeTimer"></div>
    </div>
  </div>

<script>
  /* =========================
     RESULT TIMER (NO RESET)
     ========================= */
  const RESULT_TIMER_SECONDS = 60;
  const RESULT_TIMER_KEY = "pvr_result_expiry";

  const box = document.getElementById("resultBox");
  const wa = document.getElementById("waLink");
  const closeTimer = document.getElementById("closeTimer");

  /* ---------- Load result ---------- */
  const raw = sessionStorage.getItem("pvr_lastResult");
  if (!raw) {
    box.innerHTML = "No result found. Please login again.";
  } else {
    const r = JSON.parse(raw);

    box.innerHTML = `
      <b>Candidate:</b> ${r.name}<br/>
      <b>Email:</b> ${r.email}<br/>
      <b>WhatsApp:</b> ${r.phone}<br/>
      <b>Level:</b> ${r.difficulty}<br/>
      <b>Score:</b> ${r.correct}/${r.total}<br/>
      <b>Percent:</b> ${r.percent}%<br/><br/>
      <b>Message:</b> Thanks for taking the test. If you need help, please reach out to <b>PVR Cloud Tech</b>.
    `;

    const msg = encodeURIComponent(
      `Hi PVR Cloud Tech, I completed the ${r.difficulty} ADF test.\n` +
      `Score: ${r.correct}/${r.total} (${r.percent}%).\n` +
      `Name: ${r.name}\nEmail: ${r.email}\nWhatsApp: ${r.phone}\n\n` +
      `Please share the result document to me. Thank You.`
    );

    const YOUR_WHATSAPP_NUMBER = "917569326969";
    wa.href = `https://wa.me/${YOUR_WHATSAPP_NUMBER}?text=${msg}`;
  }

  /* ---------- Timer helpers ---------- */
  function getTimeLeft(){
    const expiry = Number(sessionStorage.getItem(RESULT_TIMER_KEY) || 0);
    if (!expiry) return RESULT_TIMER_SECONDS;

    const diff = Math.ceil((expiry - Date.now()) / 1000);
    return diff > 0 ? diff : 0;
  }

  function updateTimerUI(sec){
    closeTimer.textContent = `This page will close in ${sec}s...`;
  }

  /* ---------- Init expiry ONCE ---------- */
  if (!sessionStorage.getItem(RESULT_TIMER_KEY)) {
    const expiry = Date.now() + RESULT_TIMER_SECONDS * 1000;
    sessionStorage.setItem(RESULT_TIMER_KEY, String(expiry));
  }

  /* ---------- Start timer ---------- */
  let iv = setInterval(() => {
    const left = getTimeLeft();
    updateTimerUI(left);

    if (left <= 0) {
      clearInterval(iv);
      sessionStorage.removeItem(RESULT_TIMER_KEY);
      window.location.href = "login.html";
    }
  }, 1000);

  updateTimerUI(getTimeLeft());
</script>
</body>
</html>
